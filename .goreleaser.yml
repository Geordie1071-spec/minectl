project_name: minectl

builds:
  - id: minectl
    main: ./cmd/minectl
    binary: minectl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Geordie1071-spec/minectl/internal/config.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    format: tar.gz
    name_template: "minectl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  replace_existing_artifacts: true
